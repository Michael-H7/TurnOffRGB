name: Build

on:
  push:
    branches: [ "Turn-Off-RGB", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows-release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath TurnOffRGB-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurnOffRGB-windows-x64
          path: TurnOffRGB-windows-x64.zip
